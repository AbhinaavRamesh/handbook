name: Feature request
description: Suggest a new site feature or capability (for new page content, use "New topic or improvement" instead)
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The need or frustration behind the request
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed feature
      description: What you'd like the site to do
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Study tools (progress, flashcards, quizzes)
        - Search / navigation / discoverability
        - Content presentation (diagrams, code, theming)
        - AI / mock-interview tooling
        - Accessibility
        - Other
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
    validations:
      required: false
  - type: dropdown
    id: contribute
    attributes:
      label: Would you be willing to help build it?
      options:
        - "Yes"
        - Maybe with guidance
        - "No"
    validations:
      required: false
