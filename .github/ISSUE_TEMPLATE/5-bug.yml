name: Bug (something isn't working)
description: Report a feature or tool on the site that doesn't behave as expected
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Page or feature
      description: Where the bug happens
      placeholder: e.g. /sde-coding/sprint/ progress tracker, search, Anki download
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did and what went wrong
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps so we can see it too
      value: |
        1.
        2.
        3.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Affected feature
      options:
        - Progress tracking / checkboxes
        - Search
        - Downloads (Anki deck, etc.)
        - Prep with AI (prompts / skill / command)
        - Links / navigation
        - Build / deploy
        - Other
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser & device (if relevant)
      placeholder: e.g. Firefox on Windows, mobile Safari
    validations:
      required: false
